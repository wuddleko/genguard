version: 2

project_name: genguard

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: genguard
    main: ./cmd/genguard
    binary: genguard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - genguard.example.yaml
      - src: docs/ci.md
        dst: docs
        strip_parent: true
      - src: examples/*
        dst: examples
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: wuddleko
    name: genguard
  draft: false
  prerelease: auto
